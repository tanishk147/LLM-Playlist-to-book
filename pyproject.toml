[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-playlist-book"
version = "0.1.0"
description = "Pipeline to convert a YouTube playlist into a grounded, citation-traceable eBook."
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "yt-dlp>=2024.10.7",
    "faster-whisper>=1.0.3",
    "Pillow>=10.4.0",
    "imagehash>=4.3.1",
    "PyYAML>=6.0.2",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "tenacity>=9.0.0",
    "arxiv>=2.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[project.scripts]
playlist-book = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
